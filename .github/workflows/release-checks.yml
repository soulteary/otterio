name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release preflight and promotion regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test release validation without network or credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s buildscripts -p 'test_release_*.py' -v
      - name: Check release helper shell syntax
        run: |
          bash -n buildscripts/check-new-image-tags.sh
          bash -n buildscripts/verify-release-image.sh
