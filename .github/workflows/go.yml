name: Go

# Run unit tests, race detector, cross-compile and a few integration-style
# verifications on every PR and on every push to main.
#
# This workflow mirrors the local `make` targets so that what passes here is
# what we ship. The work is split across several independent jobs so that
# GitHub Actions can run them in parallel, drastically reducing wall-clock
# time compared to one giant sequential job.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs on the same ref to save CI minutes.
concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO111MODULE: "on"

jobs:
  # Cross platform unit tests + plain build. Kept as a small matrix so that
  # ubuntu and windows run in parallel instead of serializing inside one job.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      # setup-go can cache both modules and build outputs. Manage them here
      # separately so build snapshots can advance with source commits without
      # re-uploading the module download cache for every change.
      - uses: actions/setup-go@v7.0.0
        id: go
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Resolve Go cache paths
        id: gocache
        shell: bash
        run: |
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.gocache.outputs.modcache }}
          key: gomod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            gomod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

      # Actions caches are immutable. Save a new build snapshot per commit,
      # restore the nearest compatible one, and let Go validate individual entries.
      - name: Cache plain build outputs
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.gocache.outputs.buildcache }}
          key: gobuild-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-plain-cgo0-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-plain-cgo0-${{ hashFiles('go.mod', 'go.sum') }}-
            gobuild-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-plain-cgo0-

      # Pull modules in a dedicated step so the (potentially noisy) download
      # output is clearly separated from the build/test output in the UI.
      - name: Check dependency and toolchain version consistency
        shell: bash
        run: |
          python3 -m unittest discover -s buildscripts -p test_dependency_versions.py -v
          python3 -m unittest discover -s buildscripts -p test_mint_go_installer.py -v

      - name: Download modules
        shell: bash
        run: go mod download

      - name: Build the pinned Mint SDK functional harness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mint_core="$RUNNER_TEMP/mint-sdk-core"
          mkdir -p "$mint_core/minio-go"
          cp mint/run/core/minio-go/go.mod mint/run/core/minio-go/go.sum "$mint_core/minio-go/"
          MINT_RUN_CORE_DIR="$mint_core" bash mint/build/minio-go/install.sh
          cmp mint/run/core/minio-go/go.mod "$mint_core/minio-go/go.mod"
          cmp mint/run/core/minio-go/go.sum "$mint_core/minio-go/go.sum"

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Build the binary we ship on windows/amd64. Keep the full
          # ./cmd/... test suite on Linux: it inherits MinIO's POSIX-only test
          # assumptions (e.g. erasure format/healing paths, data-usage
          # scanner) and either deadlocks or fails on Windows file system
          # semantics. Upstream MinIO itself runs its Go tests only on
          # Linux for the same reason; the full ./... matrix lives on the
          # Linux job below where it actually exercises real behaviour.
          #
          # We still inject version info via gen-ldflags so the produced
          # binary (and the browser uiVersion it reports) is a valid
          # RFC3339 version instead of the "DEVELOPMENT.GOGET" default,
          # matching the Makefile/Docker builds.
          go build --ldflags="$(go run buildscripts/gen-ldflags.go)" -o otterio.exe

      - name: Directory regression tests (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Exercise Windows directory handles, EOF/count semantics, reparse
          # points and early stop without running the POSIX-dependent suite.
          go test -count=1 -timeout 5m ./cmd -run '^(TestReadDir|TestReadDirFail|TestReadDirN|TestXLStorageIsDirEmpty|TestWindowsReadDir.*)$'

      - name: Server startup and S3 smoke test (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go run buildscripts/verify-s3-startup.go ./otterio.exe

      - name: SigV4 security regressions (linux)
        if: matrix.os == 'ubuntu-latest'
        run: >-
          go test -v -count=1 -timeout 10m ./cmd
          -run '^(TestSignedHeaderCoverage|TestPresignedHeaderQueryCoverage|TestSignatureV4RejectsInjectedHeaders|TestPresignedHoistedHeaderSignature|TestObjectTagsDoNotMutateSignedHeaders|TestSignatureV4PayloadHeaderCompatibility|TestAPISignedHeaderCopyIsolation|TestAPICopyObjectHandler|TestAPICopyObjectPartHandler|TestAPICopyObjectPartHandlerSanity|TestDoesPresignedSignatureMatch|TestGetObjectPrecondition.*|TestHeadObjectPrecondition.*)$'

      - name: Console base protocol regressions (linux)
        if: matrix.os == 'ubuntu-latest'
        run: >-
          go test -v -count=1 -timeout 15m ./cmd
          -run 'TestBucketConfig|TestSelfCredentials|TestConfiguration|TestFiber|TestGetBucket|TestPutBucket|TestDeleteBucket|TestAccountInfo|TestBucketMetadata'

      - name: Lifecycle storage and restore regressions (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -v -count=1 -timeout 20m ./cmd -run 'TestBucketConfig|TestSelfCredentials|TestConfiguration|TestFiber|TestGetBucket|TestPutBucket|TestDeleteBucket|TestAccountInfo|TestBucketMetadata|TestBucketTarget|TestTransition|TestXLStorageInline|TestLifecycleTransition|TestLifecycleQueues|TestScannerLifecycle|TestExpiry|TestParseRestore|TestRestoreRequest|TestBeginRestore|TestRestoredVersion|TestPutObjectExpiry|TestFindFileInfoInQuorum|TestXLV2FormatData|TestErasureDeleteObjectBasic|TestErasureDeleteObjectsErasureSet'
          go test -v -count=1 ./pkg/bucket/lifecycle

      - name: Lifecycle storage hardening regressions (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -v -count=1 ./cmd/config/storageclass
          go test -v -count=1 -timeout 15m ./cmd -run 'TestErasurePutObject|TestXLStorageReadFile|TestXLStorageHealsPendingTransitionMetadata|TestMonitorAndConnectEndpointsCanceled|TestPutObjectNoQuorum|TestObjectQuorumFromMeta|TestDisksWithAllParts'

      - name: Version GET HEAD and copy-source authorization regressions (linux)
        if: matrix.os == 'ubuntu-latest'
        run: >-
          go test -v -count=1 -timeout 15m ./cmd
          -run '^TestConsoleVersionAuthorization'

      - name: Build & test (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go build --ldflags="$(go run buildscripts/gen-ldflags.go)" -o otterio
          go test -timeout 50m ./...

  # Race detector tests are by far the slowest step, so they get their own job.
  test-race:
    name: Race detector
    # Allow the 90-minute package budget plus setup, compilation and diagnostics.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test race CI helpers
        run: python3 -m unittest discover -s buildscripts -p 'test_race_*.py' -v
      - uses: actions/setup-go@v7.0.0
        id: go
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Resolve Go cache paths
        id: gocache
        shell: bash
        run: |
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Keep race and plain build snapshots separate. Go already distinguishes
      # their entries; separate Actions keys avoid competing incomplete snapshots.
      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.gocache.outputs.modcache }}
          key: gomod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            gomod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

      # Actions caches are immutable. Save a new build snapshot per commit,
      # restore the nearest compatible one, and let Go validate individual entries.
      - name: Cache race build outputs
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.gocache.outputs.buildcache }}
          key: gobuild-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-race-kqueue-cgo1-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-race-kqueue-cgo1-${{ hashFiles('go.mod', 'go.sum') }}-
            gobuild-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-race-kqueue-cgo1-

      - name: Download modules
        shell: bash
        run: go mod download

      - name: Race tests (full suite)
        id: race
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          mkdir -p "$RUNNER_TEMP/otterio-race"
          {
            go version
            go env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN
            printf 'CPU count: '; nproc
          } > "$RUNNER_TEMP/otterio-race/environment.txt"
          # Use the same launcher as make test-race; stdout stays pure JSON.
          # pipefail ensures tee cannot turn failed tests into a successful step.
          /usr/bin/time -v -o "$RUNNER_TEMP/otterio-race/resources.txt" \
            bash buildscripts/race.sh -json \
            | tee "$RUNNER_TEMP/otterio-race/race.jsonl"

      - name: Summarize race diagnostics
        if: always()
        shell: bash
        run: python3 buildscripts/summarize_race.py "$RUNNER_TEMP/otterio-race/race.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload race diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: race-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/otterio-race/
          if-no-files-found: warn
          retention-days: 7

  # Lint and code-generation freshness check. Previously these ran implicitly
  # as part of `make test-race` (via the `verifiers` prerequisite), which
  # bloated the race detector job's wall-clock time. Splitting them out lets
  # them run in parallel with race tests instead of blocking them.
  lint:
    name: Lint & generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        id: go
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: make verifiers
        run: make verifiers

  # Cross compile to all supported GOOS/GOARCH combinations.
  crosscompile:
    name: Cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        id: go
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: make crosscompile
        run: make crosscompile

  # # Integration-style verification (boots the server and exercises it).
  # verify:
  #   name: Verify build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7.0.1
  #     - uses: actions/setup-go@v7.0.0
  #       with:
  #         go-version-file: go.mod
  #         cache: true
  #     - name: make verify
  #       run: |
  #         sudo sysctl net.ipv6.conf.all.disable_ipv6=0
  #         sudo sysctl net.ipv6.conf.default.disable_ipv6=0
  #         make verify

  # Healing verification (boots the server with -race and exercises healing).
  verify-healing:
    name: Verify healing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        id: go
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: make verify-healing
        run: |
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make verify-healing

  # Use the official Go vulnerability scanner instead of Nancy.
  # govulncheck queries the Go vulnerability database (pkg.go.dev/vuln) and
  # only flags vulnerabilities that are actually reachable from our code, so
  # it is both more accurate and more reliable than third-party OSS Index
  # based tooling.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        id: go
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Install & run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Browser unit tests run independently of Go - no need to hold up other jobs.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
      - name: bun test
        working-directory: browser
        run: |
          bun install --frozen-lockfile
          bun run test --runInBand
          bun run release
          git diff --exit-code -- production
          test -z "$(git ls-files --others --exclude-standard production)"

  # Lightweight static checks: shellcheck on mint scripts.
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y devscripts shellcheck
      - name: Run shellcheck
        run: bash -c 'shopt -s globstar; shellcheck mint/**/*.sh'
