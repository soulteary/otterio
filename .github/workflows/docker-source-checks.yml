name: Docker source checks
on:
  pull_request:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'buildscripts/gen-ldflags.go', 'buildscripts/test_build_metadata.py', 'browser/**', '.github/workflows/docker-source-checks.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'buildscripts/gen-ldflags.go', 'buildscripts/test_build_metadata.py', 'browser/**', '.github/workflows/docker-source-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-context:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: python3 -m unittest discover -s buildscripts -p test_build_metadata.py -v
      - uses: docker/setup-buildx-action@v4
      - name: Prove uncommitted local code reaches the image
        env:
          VCS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > cmd/zz_docker_source_probe.go <<'GO'
          package cmd
          func init() { Version = "1999-01-02T03:04:05Z" }
          GO
          docker buildx build --load --build-arg "VCS_REF=$VCS_REF" -t otterio-source-test .
          docker run --rm otterio-source-test --version | grep -F '1999-01-02T03:04:05Z'
          test "$(docker image inspect otterio-source-test --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$VCS_REF"
