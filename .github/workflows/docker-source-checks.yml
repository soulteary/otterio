name: Docker source checks
on:
  pull_request:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'Dockerfile', 'Dockerfile.dev.browser', '.dockerignore', 'buildscripts/gen-ldflags.go', 'buildscripts/test_build_metadata.py', 'cmd/main.go', 'dockerscripts/docker-entrypoint.sh', 'browser/**', '.github/workflows/docker-source-checks.yml']
  push:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'Dockerfile', 'Dockerfile.dev.browser', '.dockerignore', 'buildscripts/gen-ldflags.go', 'buildscripts/test_build_metadata.py', 'cmd/main.go', 'dockerscripts/docker-entrypoint.sh', 'browser/**', '.github/workflows/docker-source-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-context:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - run: python3 -m unittest discover -s buildscripts -p test_build_metadata.py -v
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Prove uncommitted local code reaches the image
        env:
          VCS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          probe=cmd/zz_docker_source_probe.go
          test ! -e "$probe"
          trap 'rm -f "$probe"' EXIT
          # --version reports ReleaseTag, not Version (see cmd/newApp).
          # Set both through uncommitted source, not a build-arg: a remote
          # checkout build must NOT pass this source-provenance regression.
          cat > "$probe" <<'GO'
          package cmd
          func init() {
              Version = "1999-01-02T03:04:05Z"
              ReleaseTag = "DEVELOPMENT.1999-01-02T03-04-05Z"
          }
          GO
          docker buildx build --load --build-arg "VCS_REF=$VCS_REF" -t otterio-source-test .
          # Keep stdout/stderr visible even when the assertion fails.
          docker run --rm otterio-source-test --version 2>&1 | tee "$RUNNER_TEMP/otterio-version.txt"
          grep -F -- 'DEVELOPMENT.1999-01-02T03-04-05Z' "$RUNNER_TEMP/otterio-version.txt"
          revision="$(docker image inspect otterio-source-test --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          printf 'Image revision: %s\n' "$revision"
          test "$revision" = "$VCS_REF"

  browser-toolchains:
    name: Browser development image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the browser development image without publishing
        run: docker build -f Dockerfile.dev.browser -t otterio-browser-toolchains:test .
      - name: Verify the bundled Go, Node and Bun versions
        run: |
          set -euo pipefail
          go_version="$(sed -n 's/^go //p' go.mod)"
          node_version="$(python3 -c 'import json; print(json.load(open("browser/package.json"))["engines"]["node"].removeprefix(">="))')"
          bun_version="$(python3 -c 'import json; print(json.load(open("browser/package.json"))["packageManager"].split("@", 1)[1])')"
          docker run --rm --network none otterio-browser-toolchains:test \
            sh -ec '
              go version
              node --version
              bun --version
              test "$(go env GOVERSION)" = "go$1"
              test "$(node --version)" = "v$2"
              test "$(bun --version)" = "$3"
            ' sh "$go_version" "$node_version" "$bun_version"
