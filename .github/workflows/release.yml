name: Release

# Publish an existing RELEASE.YYYY-MM-DDTHH-MM-SSZ tag after its main CI passes.
# See docs/releasing.md. Manual runs never create tags or build the selected branch.
on:
  push:
    tags:
      - 'RELEASE.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing RELEASE.YYYY-MM-DDTHH-MM-SSZ tag'
        required: true
        type: string
      promote_latest:
        description: 'Update latest aliases (only for the newest stable release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'

jobs:
  prepare:
    name: Validate release source and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      latest: ${{ github.event_name == 'push' || inputs.promote_latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Validate tag, source and release notes
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 buildscripts/release-preflight.py --existing "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          for workflow in go.yml lint.yml release-checks.yml; do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${RELEASE_SHA}&branch=main&event=push&per_page=1" \
              --jq '.workflow_runs[0] | [.status, .conclusion] | @tsv')"
            if [ "$result" != $'completed\tsuccess' ]; then
              echo "::error::${workflow} must succeed on main at ${RELEASE_SHA}; rerun this release after CI passes."
              exit 1
            fi
          done

      - name: Refuse to overwrite an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/published-tags"; then
            echo "::error::This release is already published. Prepare a new tag instead of overwriting it."
            exit 1
          fi

  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Cross compile
        env:
          CGO_ENABLED: '0'
          GO111MODULE: 'on'
          OTTERIO_RELEASE: RELEASE
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          LDFLAGS="$(go run buildscripts/gen-ldflags.go "$VERSION")"
          mkdir -p dist
          for p in linux/amd64 linux/arm64 linux/ppc64le darwin/amd64 darwin/arm64 windows/amd64; do
            os="${p%/*}"
            arch="${p#*/}"
            out="dist/otterio-${os}-${arch}"
            if [ "$os" = windows ]; then out="${out}.exe"; fi
            GOOS="$os" GOARCH="$arch" go build \
              -tags kqueue -trimpath -ldflags "$LDFLAGS" -o "$out" .
          done
          (cd dist && sha256sum otterio-* > "otterio-${TAG}-checksums.txt")

      - name: Smoke test the release binary
        run: go run buildscripts/verify-s3-startup.go ./dist/otterio-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [prepare, binaries]
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Verify binaries and restore executable bits
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd dist && sha256sum -c "otterio-${RELEASE_TAG}-checksums.txt")
          chmod +x dist/otterio-linux-*

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PROMOTE_LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -euo pipefail
          GHCR_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${GHCR_REPO}:${RELEASE_TAG}"
          if [ "$PROMOTE_LATEST" = true ]; then TAGS="${TAGS},${GHCR_REPO}:latest"; fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            DH_REPO="${DOCKERHUB_USERNAME}/otterio"
            TAGS="${TAGS},${DH_REPO}:${RELEASE_TAG}"
            if [ "$PROMOTE_LATEST" = true ]; then TAGS="${TAGS},${DH_REPO}:latest"; fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64,linux/ppc64le
          push: true
          build-args: |
            RELEASE=${{ needs.prepare.outputs.tag }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, binaries, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Recheck the tag before publishing
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 buildscripts/release-preflight.py --existing "$RELEASE_TAG"

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: cd dist && sha256sum -c "otterio-${RELEASE_TAG}-checksums.txt"

      - name: Recheck publication state before uploading
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/published-tags"; then
            echo "::error::This release is already published; refusing to overwrite it."
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Version ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: ${{ needs.prepare.outputs.latest }}
