name: Release

# Publish fixed-version artifacts first. Only the separately serialized promotion
# workflow may move latest aliases, using the recorded, smoke-tested digest.
on:
  push:
    tags:
      - 'RELEASE.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing RELEASE.YYYY-MM-DDTHH-MM-SSZ tag'
        required: true
        type: string
      promote_latest:
        description: 'Promote only if this is the newest published stable release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release source and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      latest: ${{ github.event_name == 'push' || inputs.promote_latest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - name: Validate tag, source and release notes
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 buildscripts/release-preflight.py --existing "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require successful main CI for the exact commit
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: python3 buildscripts/release-ci.py "$GITHUB_REPOSITORY" "$RELEASE_SHA" --timeout 3600 --interval 30
      - name: Reject published releases and prerelease drafts before building
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft != true or .prerelease != false) | .tag_name' > "$RUNNER_TEMP/unavailable-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/unavailable-tags"; then
            echo '::error::Release is already published or is not a stable draft. Resolve draft state before building; use Stable release promotion for published stable releases.'
            exit 1
          fi

  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Cross compile
        env:
          CGO_ENABLED: '0'
          GO111MODULE: 'on'
          OTTERIO_RELEASE: RELEASE
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          LDFLAGS="$(go run buildscripts/gen-ldflags.go "$VERSION")"
          mkdir -p dist
          for p in linux/amd64 linux/arm64 linux/ppc64le darwin/amd64 darwin/arm64 windows/amd64; do
            os="${p%/*}"
            arch="${p#*/}"
            out="dist/otterio-${os}-${arch}"
            if [ "$os" = windows ]; then out="${out}.exe"; fi
            GOOS="$os" GOARCH="$arch" go build \
              -tags kqueue -trimpath -ldflags "$LDFLAGS" -o "$out" .
          done
          (cd dist && sha256sum otterio-* > "otterio-${TAG}-checksums.txt")
      - name: Smoke test the release binary
        run: go run buildscripts/verify-s3-startup.go ./dist/otterio-linux-amd64
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build and verify fixed-version images
    runs-on: ubuntu-latest
    needs: [prepare, binaries]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      # Repository names can contain DOCKERHUB_USERNAME and be dropped as secrets.
      # Keep names within this job; pass only the successful build's selection.
      dockerhub_published: ${{ steps.tags.outputs.dockerhub_published }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: binaries
          path: dist
      - name: Verify binaries and restore executable bits
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd dist && sha256sum -c "otterio-${RELEASE_TAG}-checksums.txt")
          chmod +x dist/otterio-linux-*
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Compute immutable image tags
        id: tags
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          GHCR_REPO="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          TAGS="${GHCR_REPO}:${RELEASE_TAG}"
          echo "ghcr_repository=$GHCR_REPO" >> "$GITHUB_OUTPUT"
          dockerhub_published=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            DH_REPO="${DOCKERHUB_USERNAME}/otterio"
            TAGS="${TAGS},${DH_REPO}:${RELEASE_TAG}"
            dockerhub_published=true
          fi
          IFS=',' read -ra references <<< "$TAGS"
          bash buildscripts/check-new-image-tags.sh "${references[@]}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "dockerhub_published=$dockerhub_published" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        id: image
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64,linux/ppc64le
          push: true
          # Stable releases always fetch current runtime packages, even on rerun.
          build-args: |
            RELEASE=${{ needs.prepare.outputs.tag }}
            RUNTIME_REFRESH=release-${{ github.run_id }}-${{ github.run_attempt }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          provenance: false
          cache-from: type=gha,scope=otterio-release
          cache-to: type=gha,scope=otterio-release,mode=max
      - name: S3 round trip against the pushed image digest
        env:
          IMAGE_REF: ${{ steps.tags.outputs.ghcr_repository }}@${{ steps.image.outputs.digest }}
        run: bash buildscripts/verify-release-image.sh "$IMAGE_REF"

  release:
    name: Verify draft assets and publish without moving latest
    runs-on: ubuntu-latest
    needs: [prepare, binaries, docker]
    # A new published release invalidates an older promotion plan. Serialize
    # publication with the ENTIRE promotion workflow, even when latest=false.
    # Keep this at job scope: the caller must release the lock before promotion.
    concurrency:
      group: otterio-stable-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Recheck the remote tag before publishing
        run: |
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 buildscripts/release-preflight.py --existing "$RELEASE_TAG"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: binaries
          path: dist
      - name: Verify release assets and record immutable image identities
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          DOCKERHUB_PUBLISHED: ${{ needs.docker.outputs.dockerhub_published }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "otterio-${RELEASE_TAG}-checksums.txt")
          python3 buildscripts/release-promotion.py "$RELEASE_TAG" \
            --write-manifest dist/release-manifest.json \
            --source-sha "$RELEASE_SHA" --repository "$GITHUB_REPOSITORY" \
            --digest "$IMAGE_DIGEST" --dockerhub-published "$DOCKERHUB_PUBLISHED" \
            --dockerhub-user "$DOCKERHUB_USERNAME"
      - name: Upload only to a draft and verify downloaded assets
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag)' > "$RUNNER_TEMP/release-state.json"
          if [ -s "$RUNNER_TEMP/release-state.json" ]; then
            jq -se 'length == 1 and .[0].draft == true and .[0].prerelease == false' "$RUNNER_TEMP/release-state.json" >/dev/null || {
              echo '::error::Expected one non-prerelease draft; refusing to change release assets or publication state.'; exit 1;
            }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --target "$RELEASE_SHA" --title "Version $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest=false
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          diff <(find dist -maxdepth 1 -type f -printf '%f\n' | sort) <(find "$verify_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          for asset in dist/*; do cmp "$asset" "$verify_dir/$(basename "$asset")"; done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  promote:
    name: Promote verified stable digests
    needs: [prepare, release]
    if: needs.prepare.outputs.latest == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/promote-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
