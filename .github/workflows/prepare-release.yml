name: Prepare release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New immutable RELEASE.YYYY-MM-DDTHH-MM-SSZ tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-tag
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require the trusted main workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source, create an immutable tag and dispatch draft build
        run: python3 buildscripts/prepare-release-tag.py "$RELEASE_TAG"
